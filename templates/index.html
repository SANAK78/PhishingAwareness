<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urgent: Account Verification Required</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #060913;
            --card-surface: rgba(15, 23, 42, 0.78);
            --border-subtle: rgba(239, 68, 68, 0.25);
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
            --text-heading: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top right, #1e112a, #060913 60%);
            color: var(--text-heading);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            padding: 38px 32px;
            box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.9), 0 0 25px rgba(239, 68, 68, 0.12);
            backdrop-filter: blur(20px);
        }

        .alert-banner {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 12px 14px;
            border-radius: 12px;
            color: #fca5a5;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .title-block { text-align: center; margin-bottom: 24px; }
        .title-block h1 { font-size: 1.55rem; font-weight: 800; margin-bottom: 6px; }
        .title-block p { font-size: 0.85rem; color: var(--text-secondary); }

        .form-group { margin-bottom: 18px; text-align: left; }
        label { display: block; font-size: 0.78rem; font-weight: 700; color: #cbd5e1; margin-bottom: 8px; }

        input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(6, 9, 19, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #fff;
            font-size: 0.92rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 24px -5px rgba(239, 68, 68, 0.4);
            transition: all 0.2s ease;
        }

        button:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .simulation-flag {
            margin-top: 24px;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="alert-banner">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>CRITICAL: Account suspension in 1 hour due to expired SSL keys.</span>
        </div>

        <div class="title-block">
            <h1>Identity Verification</h1>
            <p>Sign in to confirm administrative access & unlock session</p>
        </div>

        <form action="/login-attempt" method="POST">
            <div class="form-group">
                <label for="email">Corporate Email Address</label>
                <input type="email" id="email" name="email" placeholder="name@company.com" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Enterprise Passphrase</label>
                <input type="password" id="password" name="password" placeholder="••••••••••••" required>
            </div>

            <button type="submit">Verify & Preserve Access</button>
        </form>

        <div class="simulation-flag">
            SIMULATION TAG: SEC-TEST-TRAINING // ZERO-CREDENTIAL EXPOSURE
        </div>
    </div>

</body>
</html>
